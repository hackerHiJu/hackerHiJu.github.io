# ======== Inject 自定义 ========
inject:
  head:
    - |
      <style>
      /* === 分类页 catalog 栏：隐藏 >> 和更多按钮，超出用滚动条 === */
      .category-bar-next, .catalog-more { display: none !important; }
      #catalog-list { overflow-x: auto !important; scrollbar-width: thin; }
      #catalog-list::-webkit-scrollbar { height: 4px; }
      #catalog-list::-webkit-scrollbar-thumb { background: var(--anzhiyu-main); border-radius: 2px; }

      /* === 关于页：技能标题不被图标遮挡 === */
      .author-content-item.skills .card-content {
        position: relative;
        z-index: 2;
      }
      .author-content-item.skills .skills-style-group {
        margin-top: 1rem;
      }

      /* === 关于页：地图背景显示 === */
      .author-content-item.map {
        min-height: 200px !important;
        background-size: cover !important;
        background-position: center !important;
      }

      /* === 关于页：职业生涯时间线连接线 === */
      .author-content-item.careers .careers-group {
        position: relative;
      }
      .author-content-item.careers .careers-group::before {
        content: '';
        position: absolute;
        left: 7px;
        top: 16px;
        bottom: 16px;
        width: 2px;
        background: linear-gradient(to bottom, var(--anzhiyu-card-bg), var(--anzhiyu-main), var(--anzhiyu-card-bg));
        z-index: 0;
      }
      .author-content-item.careers .career-item {
        position: relative;
        z-index: 1;
        padding: 8px 0;
      }
      .author-content-item.careers .career-item .circle {
        box-shadow: 0 0 0 4px var(--anzhiyu-card-bg);
        flex-shrink: 0;
      }
      .author-content-item.careers .career-item .name {
        color: var(--anzhiyu-secondtext);
        font-weight: 600;
        font-size: 0.95rem;
      }

      /* === 补充分类按钮 purple 和 yellow 配色（主题只内置 red/blue/green）=== */
      a.categoryButton.purple {
        background: linear-gradient(to right, #8b5cf6, #c084fc) !important;
        background-size: 200% !important;
      }
      a.categoryButton.yellow {
        background: linear-gradient(to right, #f59e0b, #fbbf24) !important;
        background-size: 200% !important;
      }
      [data-theme="dark"] a.categoryButton.purple {
        background: linear-gradient(to right, #6d28d9, #9333ea) !important;
        background-size: 200% !important;
      }
      [data-theme="dark"] a.categoryButton.yellow {
        background: linear-gradient(to right, #b45309, #d97706) !important;
        background-size: 200% !important;
      }

      /* === 修复标题被技能图标遮挡 === */
      #random-banner .banners-title {
        z-index: 2 !important;
      }
      #skills-tags-group-all {
        margin-top: 5rem !important;
      }

      /* === 首页及子页 Banner 背景图 === */
      #page-header.full_page,
      #page-header.not-home-page {
        background: url(/images/banner-bg.png) center center / cover no-repeat !important;
        background-attachment: fixed !important;
      }
      /* === "随便逛逛" hover 背景改为橙红主色调 === */
      #random-banner:hover #random-hover {
        background: linear-gradient(135deg, rgba(255,107,53,0.92), rgba(255,140,50,0.88)) !important;
        backdrop-filter: blur(8px) !important;
      }
      /* === 亮色模式导航栏配色优化 === */
      /* 首页未滚动时：导航透明背景叠在 banner 上，文字需足够深色 */
      #page-header:not(.nav-fixed) #nav #site-name .title,
      #page-header:not(.nav-fixed) #nav #menus .menus_item > a.site-page,
      #page-header:not(.nav-fixed) #nav #nav-right .nav-button a {
        color: #1a1a2e !important;
        font-weight: 600 !important;
        text-shadow: 0 1px 4px rgba(255,255,255,0.6) !important;
      }
      /* 首页未滚动时：站点名称 hover 橙红 */
      #page-header:not(.nav-fixed) #nav #site-name:hover .title {
        color: #ff6b35 !important;
      }
      /* 首页未滚动时：菜单 hover 橙红 */
      #page-header:not(.nav-fixed) #nav #menus .menus_item:hover > a.site-page {
        color: #ff6b35 !important;
        background: rgba(255,107,53,0.1) !important;
      }
      /* 滚动固定后：导航有背景，文字用深色 */
      #page-header.nav-fixed #nav #site-name .title,
      #page-header.nav-fixed #nav #menus .menus_item > a.site-page,
      #page-header.nav-fixed #nav #nav-right .nav-button a {
        color: var(--anzhiyu-fontcolor) !important;
        font-weight: 600 !important;
      }
      /* 滚动固定后：hover 橙红 */
      #page-header.nav-fixed #nav #site-name:hover .title,
      #page-header.nav-fixed #nav #menus .menus_item:hover > a.site-page,
      #page-header.nav-fixed #nav #nav-right .nav-button:hover a {
        color: #ff6b35 !important;
      }
      /* 文章页（post）保持白色文字不变（暗色 banner 上白色合适） */
      .post #page-header:not(.nav-fixed) #nav #site-name .title,
      .post #page-header:not(.nav-fixed) #nav #menus .menus_item > a.site-page,
      .post #page-header:not(.nav-fixed) #nav #nav-right .nav-button a {
        color: #fff !important;
        text-shadow: 0 1px 4px rgba(0,0,0,0.4) !important;
      }
      </style>
  bottom:
    - |
      <script>
      // === 分类页 catalog-bar 只显示同级分类 ===
      function filterCatalogBar() {
        var catalogList = document.querySelector('#catalog-list');
        if (!catalogList) return;

        var path = window.location.pathname;
        var catMatch = path.match(/\/categories\/(.+?)\/?$/);
        if (!catMatch) return;

        var currentPath = decodeURIComponent(catMatch[1]).toLowerCase().replace(/\/$/, '');
        var parts = currentPath.split('/');
        var currentDepth = parts.length;
        var parentPath = parts.slice(0, -1).join('/');

        // 先检查当前分类是否有子级
        var items = catalogList.querySelectorAll('.catalog-list-item');
        var hasChildren = false;
        items.forEach(function(item) {
          var link = item.querySelector('a');
          if (!link) return;
          var href = link.getAttribute('href');
          var linkMatch = href && href.match(/\/categories\/(.+?)\/?$/);
          if (linkMatch) {
            var linkPath = decodeURIComponent(linkMatch[1]).toLowerCase().replace(/\/$/, '');
            if (linkPath.startsWith(currentPath + '/')) hasChildren = true;
          }
        });

        items.forEach(function(item) {
          var link = item.querySelector('a');
          if (!link) return;
          var href = link.getAttribute('href');

          var linkMatch = href && href.match(/\/categories\/(.+?)\/?$/);
          if (!linkMatch) { item.style.display = 'none'; return; }

          var linkPath = decodeURIComponent(linkMatch[1]).toLowerCase().replace(/\/$/, '');
          var linkParts = linkPath.split('/');
          var linkParent = linkParts.slice(0, -1).join('/');

          var show = false;

          if (hasChildren) {
            // 有子级：只显示直接子级
            if (linkParent === currentPath && linkParts.length === currentDepth + 1) {
              show = true;
            }
          } else {
            // 叶子节点：显示同级兄弟（相同父级）
            if (linkParent === parentPath && linkParts.length === currentDepth) {
              show = true;
            }
          }

          // 顶级分类页显示所有一级
          if (!show && currentDepth === 1 && linkParts.length === 1) {
            show = true;
          }

          item.style.display = show ? '' : 'none';
        });
      }

      // === 首页"更多推荐"替换为开源项目卡片 ===
      function injectProjectCards() {
        var topGroup = document.querySelector('#home_top .topGroup');
        if (!topGroup) return;

        var projects = [
          {
            name: 'Easy Agent Pilot',
            link: 'https://github.com/hyqf98/easy_agent_pilot',
            cover: '/images/projects/easy_agent_pilot.png',
            desc: '桌面 Agent 可视化界面 ⭐45'
          },
          {
            name: 'ZCode Pet',
            link: 'https://github.com/hyqf98/zcode-pet',
            cover: '/images/projects/zcode-pet.png',
            desc: 'Tauri 2 桌面宠物系统'
          },
          {
            name: 'Easy Terminal',
            link: 'https://github.com/hyqf98/easy_terminal',
            cover: '/images/projects/easy_terminal.png',
            desc: '终端命令行工具'
          },
          {
            name: 'IdeaTools',
            link: 'https://github.com/hyqf98/IdeaTools',
            cover: '/images/projects/IdeaTools.png',
            desc: 'IDEA 工具插件集合 ⭐3'
          },
          {
            name: 'EasyAgent',
            link: 'https://github.com/hyqf98/EasyAgent',
            cover: '/images/projects/EasyAgent.png',
            desc: 'IDEA AI 助手插件'
          },
          {
            name: 'Easy DB MCP',
            link: 'https://github.com/hyqf98/easy_db_mcp_server',
            cover: '/images/projects/easy_db_mcp_server.png',
            desc: '数据库操作 MCP 工具'
          }
        ];

        // 保留 todayCard（大 banner），替换前面的文章卡片
        var todayCard = topGroup.querySelector('#todayCard');
        // 移除所有 .recent-post-item
        topGroup.querySelectorAll('.recent-post-item').forEach(function(el) { el.remove(); });

        // 在 todayCard 前插入项目卡片
        projects.forEach(function(proj) {
          var item = document.createElement('div');
          item.className = 'recent-post-item';
          item.style.cursor = 'pointer';
          item.onclick = function() { window.open(proj.link, '_blank'); };
          item.innerHTML =
            '<div class="post_cover left_radius">' +
              '<a href="' + proj.link + '" target="_blank" title="' + proj.name + '">' +
                '<span class="recent-post-top-text">荐</span>' +
                '<img class="post_bg nolazyload" alt="' + proj.name + '" src="' + proj.cover + '">' +
              '</a>' +
            '</div>' +
            '<div class="recent-post-info">' +
              '<a class="article-title" href="' + proj.link + '" target="_blank" title="' + proj.name + '">' + proj.name + '</a>' +
              '<div style="font-size:12px;color:var(--anzhiyu-secondtext);margin-top:4px;">' + proj.desc + '</div>' +
            '</div>';
          if (todayCard) {
            topGroup.insertBefore(item, todayCard);
          } else {
            topGroup.appendChild(item);
          }
        });
      }

      // PJAX 兼容
      document.addEventListener('DOMContentLoaded', injectProjectCards);
      document.addEventListener('pjax:complete', injectProjectCards);
      document.addEventListener('pjax:complete', filterCatalogBar);
      document.addEventListener('DOMContentLoaded', filterCatalogBar);
      setTimeout(injectProjectCards, 500);
      setTimeout(injectProjectCards, 1500);
      setTimeout(filterCatalogBar, 500);
      </script>

